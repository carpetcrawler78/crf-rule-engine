[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crf-rule-engine"
version = "0.2.0"
description = "Excel-driven plausibility checks for clinical study questionnaires, with SAS code generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Heger" }]
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "streamlit>=1.40"]
app = ["streamlit>=1.40"]

[project.scripts]
crf-rules = "crf_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
