  <div id="root"><p id="boot">Starting Python in your browser (first load takes about 20-40 s)&hellip;</p></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    const FILES = {"streamlit_app.py": "\"\"\"CRF Rule Engine - browser app.\n\nRuns locally with `streamlit run app/streamlit_app.py` or fully in the browser\nwith stlite (see app/build_stlite.py). In the browser version nothing is\nuploaded anywhere: Python runs inside the page.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport sys\nfrom pathlib import Path\n\nimport pandas as pd\nimport streamlit as st\n\nHERE = Path(__file__).resolve().parent\nfor candidate in (HERE, HERE.parent / \"src\"):  # stlite: package next to the app; local: repo/src\n    if (candidate / \"crf_rules\").is_dir() and str(candidate) not in sys.path:\n        sys.path.insert(0, str(candidate))\n\nfrom crf_rules import (compile_rules, generate_sas, load_corrections, load_specs,  # noqa: E402\n                       queries_by_site, query_workbook, read_raw, report_workbook, run)\n\nDEMO_DIRS = [HERE / \"demo\", HERE.parent]\nDEMO_FILES = {\n    \"rules\": \"demo_fu12_rules.xlsx\",\n    \"raw\": \"demo_fu12_raw.csv\",\n    \"log\": \"demo_fu12_corrections_log.xlsx\",\n}\n\n\ndef demo_bytes(key: str) -> bytes:\n    name = DEMO_FILES[key]\n    for base in DEMO_DIRS:\n        for sub in (\"\", \"rules\", \"data\", \"corrections\"):\n            p = base / sub / name\n            if p.exists():\n                return p.read_bytes()\n    raise FileNotFoundError(name)\n\n\n@st.cache_data(show_spinner=False)\ndef analyse(rules: bytes, raw: bytes, log: bytes | None, use_log: bool):\n    specs = load_specs(io.BytesIO(rules))\n    corrections = load_corrections(io.BytesIO(log)) if (log and use_log) else None\n    result = run(read_raw(io.BytesIO(raw)), specs, corrections=corrections)\n    _, issues = compile_rules(specs)\n    return specs, result, issues\n\n\nst.set_page_config(page_title=\"CRF Rule Engine\", page_icon=\"\ud83e\ude7a\", layout=\"wide\")\nst.title(\"CRF Rule Engine\")\nst.caption(\"Plausibility checks for paper-CRF studies, maintained in Excel instead of code. \"\n           \"**Runs entirely in your browser - no file leaves this computer.**\")\n\nwith st.expander(\"How the cleaning cycle works\", expanded=False):\n    st.markdown(\n        \"\"\"\n| | Artifact | Who maintains it | When |\n|---|---|---|---|\n| 1 | **Data validation plan** - rules sheet, one row per CRF field | data management, versioned | fixed at study start, changes documented |\n| 2 | **Raw export** from the scanner | nobody - never edited | every scan run |\n| 3 | **Edit-check program** (SAS / this app) generated from 1 | generated, not hand-written | whenever 1 changes |\n| 4 | **Query files** - one per site: *have, why, where*, site fills in *want* | data management -> sites | after every check run |\n| 5 | **Correction log** - every change with who, what, when, why | data management | continuously |\n| 6 | **Audit trail** - which corrections were applied or rejected | generated | every run |\n\nCleaned data = raw export + correction log. The raw export is never overwritten,\nso every number in the analysis can be traced back to the scanned form.\n\"\"\"\n    )\n\n# ---------------------------------------------------------------- inputs\nwith st.sidebar:\n    st.header(\"Input\")\n    if st.button(\"Load fictional demo study\", width=\"stretch\"):\n        st.session_state[\"demo\"] = True\n    up_rules = st.file_uploader(\"1  Data validation plan (rules .xlsx)\", type=[\"xlsx\"])\n    up_raw = st.file_uploader(\"2  Raw scanner export (.csv, | separated)\", type=[\"csv\", \"txt\"])\n    up_log = st.file_uploader(\"3  Correction log (.xlsx, optional)\", type=[\"xlsx\"])\n    use_log = st.checkbox(\"Apply correction log\", value=True,\n                          help=\"Switch off to see the findings before any query was answered.\")\n    st.divider()\n    st.caption(\"Demo study ACTIVE-65 is fictional; all data are synthetic.\")\n\ndemo = st.session_state.get(\"demo\", False)\nrules_b = up_rules.getvalue() if up_rules else (demo_bytes(\"rules\") if demo else None)\nraw_b = up_raw.getvalue() if up_raw else (demo_bytes(\"raw\") if demo else None)\nlog_b = up_log.getvalue() if up_log else (demo_bytes(\"log\") if demo else None)\n\nif not (rules_b and raw_b):\n    st.info(\"Upload a rules sheet and a raw export in the sidebar, or click **Load fictional demo study**.\")\n    st.stop()\n\ntry:\n    specs, result, issues = analyse(rules_b, raw_b, log_b, use_log)\nexcept Exception as exc:  # show the problem instead of a stack trace\n    st.error(f\"Could not process the files: {exc}\")\n    st.stop()\n\nf, cleaned, audit = result.findings, result.cleaned, result.audit\nn = len(cleaned)\nn_bad = int((cleaned[\"_n_findings\"] > 0).sum())\n\ntabs = st.tabs([\"Overview\", \"Findings\", \"Queries to sites\", \"Corrections & audit trail\",\n                \"Rules (validation plan)\", \"SAS program\"])\n\n# ---------------------------------------------------------------- overview\nwith tabs[0]:\n    c = st.columns(5)\n    c[0].metric(\"Questionnaires\", n)\n    c[1].metric(\"With open queries\", n_bad, help=f\"{100 * n_bad / n:.1f} % of all questionnaires\" if n else None)\n    c[2].metric(\"Findings\", len(f))\n    c[3].metric(\"Corrections applied\", int((audit[\"status\"] == \"applied\").sum()) if len(audit) else 0)\n    c[4].metric(\"Corrections rejected\", int((audit[\"status\"] != \"applied\").sum()) if len(audit) else 0)\n    if issues:\n        st.warning(f\"{len(issues)} rule(s) could not be used - see tab *Rules*.\")\n    if len(f):\n        left, right = st.columns(2)\n        with left:\n            st.subheader(\"Findings per field\")\n            st.bar_chart(f[\"variable\"].value_counts().sort_values())\n        with right:\n            st.subheader(\"Open queries per site\")\n            st.bar_chart(f.groupby(\"site\")[\"id\"].nunique().rename(\"participants\"))\n    else:\n        st.success(\"No findings - the data meet every rule.\")\n    st.download_button(\"Download full report (.xlsx)\", report_workbook(result),\n                       file_name=\"plausibility_report.xlsx\")\n\n# ---------------------------------------------------------------- findings\nwith tabs[1]:\n    c = st.columns(3)\n    sites = c[0].multiselect(\"Site\", sorted(f[\"site\"].unique()))\n    fields = c[1].multiselect(\"Field\", sorted(f[\"variable\"].unique()))\n    kinds = c[2].multiselect(\"Type\", [\"format\", \"rule\"])\n    view = f\n    if sites:\n        view = view[view[\"site\"].isin(sites)]\n    if fields:\n        view = view[view[\"variable\"].isin(fields)]\n    if kinds:\n        view = view[view[\"type\"].isin(kinds)]\n    st.caption(f\"{len(view)} of {len(f)} findings\")\n    st.dataframe(view.drop(columns=[\"rule\"]), width=\"stretch\", hide_index=True)\n    with st.expander(\"Show the technical rule behind each finding\"):\n        st.dataframe(view[[\"query_id\", \"rule\"]], width=\"stretch\", hide_index=True)\n\n# ---------------------------------------------------------------- queries\nwith tabs[2]:\n    st.markdown(\"One Excel file per site, so every clinic sees **only its own participants**. \"\n                \"Grey columns: *have* and *why*. Yellow columns: the site fills in *want* and the source.\")\n    tables = queries_by_site(result)\n    if not tables:\n        st.success(\"No open queries.\")\n    for site, table in tables.items():\n        with st.container(border=True):\n            a, b = st.columns([3, 1])\n            a.markdown(f\"**Site {site}** - {len(table)} queries, {table['Participant ID'].nunique()} participants\")\n            b.download_button(f\"queries_{site}.xlsx\", query_workbook(table, site),\n                              file_name=f\"queries_{site}.xlsx\", key=f\"q_{site}\")\n            st.dataframe(table, width=\"stretch\", hide_index=True, height=min(38 * (len(table) + 1), 300))\n\n# ---------------------------------------------------------------- corrections\nwith tabs[3]:\n    st.markdown(\"The correction log records every change: **who, what, when, why**. \"\n                \"A correction is applied only if the data still contain `old_value`. \"\n                \"Otherwise it is rejected as a *conflict*, so a stale answer can never overwrite newer data.\")\n    if not len(audit):\n        st.info(\"No correction log loaded (or switched off in the sidebar).\")\n    else:\n        conflicts = audit[audit[\"status\"] != \"applied\"]\n        if len(conflicts):\n            st.error(f\"{len(conflicts)} correction(s) not applied:\")\n            st.dataframe(conflicts, width=\"stretch\", hide_index=True)\n        st.dataframe(audit, width=\"stretch\", hide_index=True)\n        st.download_button(\"Download audit trail (.csv)\", audit.to_csv(index=False).encode(),\n                           file_name=\"audit_trail.csv\")\n    st.download_button(\"Download cleaned dataset (.csv)\", cleaned.to_csv(index=False).encode(),\n                       file_name=\"cleaned.csv\")\n\n# ---------------------------------------------------------------- rules\nwith tabs[4]:\n    problems = {i.variable: i.problem for i in issues}\n    table = pd.DataFrame([{\n        \"field\": s.variable, \"question\": s.label, \"format\": s.fmt.code, \"rule\": s.rule,\n        \"message\": s.message, \"status\": problems.get(s.variable, \"ok\" if s.rule else \"no rule\"),\n    } for s in specs])\n    st.markdown(\"Rules are written in SAS syntax; `#` stands for the field itself. \"\n                \"A rule describes a **good** value.\")\n    st.dataframe(table, width=\"stretch\", hide_index=True)\n\n# ---------------------------------------------------------------- SAS\nwith tabs[5]:\n    code = generate_sas(specs, source=\"rules sheet\")\n    st.markdown(\"The same checks as a plain SAS program. Set three paths at the top and run it.\")\n    st.download_button(\"Download edit_checks.sas\", code.encode(), file_name=\"edit_checks.sas\")\n    st.code(code, language=\"sas\")\n", "crf_rules/__init__.py": "\"\"\"Excel-driven plausibility checks for clinical study questionnaires (CRFs).\"\"\"\n\nfrom .engine import (\n    FieldSpec,\n    Result,\n    apply_corrections,\n    compile_rules,\n    load_corrections,\n    load_specs,\n    queries_by_site,\n    query_workbook,\n    read_raw,\n    report_workbook,\n    run,\n    write_outputs,\n)\nfrom .formats import FieldFormat, parse_format\nfrom .rules import RuleError, translate\nfrom .sas_codegen import generate_sas\n\n__all__ = [\n    \"FieldFormat\", \"FieldSpec\", \"Result\", \"RuleError\", \"apply_corrections\", \"compile_rules\",\n    \"generate_sas\", \"load_corrections\", \"load_specs\", \"parse_format\", \"queries_by_site\",\n    \"query_workbook\", \"read_raw\", \"report_workbook\", \"run\", \"translate\", \"write_outputs\",\n]\n__version__ = \"0.2.0\"\n", "crf_rules/cli.py": "\"\"\"Command line interface.\n\n    crf-rules lint      rules.xlsx                      check the rules sheet only\n    crf-rules check     rules.xlsx raw.csv -c log.xlsx -o out/\n                                                        apply correction log, run checks,\n                                                        write report, audit trail, query files\n    crf-rules gen-sas   rules.xlsx -o checks.sas        write the SAS cleaning program\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport sys\nfrom pathlib import Path\n\nfrom .engine import compile_rules, load_corrections, load_specs, read_raw, run, write_outputs\nfrom .sas_codegen import generate_sas\n\n\ndef _lint(args: argparse.Namespace) -> int:\n    specs = load_specs(args.rules, args.sheet)\n    compiled, issues = compile_rules(specs)\n    print(f\"{len(specs)} fields, {len(compiled)} rules translated, {len(issues)} problems\")\n    for i in issues:\n        print(f\"  {i.variable:<24} {i.problem}\\n  {'':<24} rule: {i.rule}\")\n    return 1 if issues else 0\n\n\ndef _check(args: argparse.Namespace) -> int:\n    specs = load_specs(args.rules, args.sheet)\n    result = run(read_raw(args.raw, sep=args.sep), specs, id_var=args.id,\n                 corrections=load_corrections(args.corrections))\n    paths = write_outputs(result, args.out)\n    print(result.summary.to_string(index=False))\n    for name, p in paths.items():\n        print(f\"{name:>14}: {p}\")\n    return 0\n\n\ndef _gen_sas(args: argparse.Namespace) -> int:\n    specs = load_specs(args.rules, args.sheet)\n    code = generate_sas(specs, id_var=args.id, source=Path(args.rules).name)\n    if args.out:\n        Path(args.out).write_text(code, encoding=\"utf-8\")\n        print(f\"written: {args.out}\")\n    else:\n        sys.stdout.write(code)\n    return 0\n\n\ndef main(argv: list[str] | None = None) -> int:\n    p = argparse.ArgumentParser(prog=\"crf-rules\", description=\"Excel-driven plausibility checks for CRF data\")\n    sub = p.add_subparsers(dest=\"cmd\", required=True)\n\n    def common(sp: argparse.ArgumentParser) -> None:\n        sp.add_argument(\"rules\", help=\"Excel file with one row per CRF field\")\n        sp.add_argument(\"--sheet\", default=0, help=\"sheet name or index (default: first sheet)\")\n        sp.add_argument(\"--id\", default=None, help=\"ID variable (default: first field in the sheet)\")\n\n    sp = sub.add_parser(\"lint\", help=\"check the rules sheet for typos and unknown variables\")\n    common(sp)\n    sp.set_defaults(func=_lint)\n\n    sp = sub.add_parser(\"check\", help=\"run format and rule checks on a raw export\")\n    common(sp)\n    sp.add_argument(\"raw\", help=\"pipe-delimited raw export\")\n    sp.add_argument(\"-c\", \"--corrections\", default=None, help=\"correction log (.xlsx), optional\")\n    sp.add_argument(\"-o\", \"--out\", default=\"output\", help=\"output folder\")\n    sp.add_argument(\"--sep\", default=\"|\", help=\"field separator (default: |)\")\n    sp.set_defaults(func=_check)\n\n    sp = sub.add_parser(\"gen-sas\", help=\"generate the SAS cleaning program\")\n    common(sp)\n    sp.add_argument(\"-o\", \"--out\", default=None, help=\"target .sas file (default: stdout)\")\n    sp.set_defaults(func=_gen_sas)\n\n    args = p.parse_args(argv)\n    if isinstance(args.sheet, str) and args.sheet.isdigit():\n        args.sheet = int(args.sheet)\n    return args.func(args)\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "crf_rules/engine.py": "\"\"\"The data-cleaning cycle of a paper-CRF study.\n\n    1. rules sheet  (data validation plan, fixed at study start, versioned)\n    2. raw export   (scanner output, never edited by hand)\n    3. correction log (every change: who, what, when, why)  -> audit trail\n    4. checks       (format + plausibility rules) on raw + corrections\n    5. outputs      cleaned dataset, findings, one query file per site\n\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime as _dt\nimport io\nimport re\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n\nfrom .formats import FieldFormat, parse_format\nfrom .rules import MISSING, CompiledRule, RuleError, from_sas_date, to_sas_date, translate\n\n# Column names accepted in the rules sheet (English demo layout and the\n# German layout of the original scanner definition files).\n_ALIASES = {\n    \"variable\": [\"variable\", \"datensatzvariable\", \"endvariablenname\"],\n    \"label\": [\"label\", \"question\", \"beschreibung\", \"fb_fragenummer\"],\n    \"coding\": [\"coding\", \"kodierung\"],\n    \"format\": [\"format\", \"variablen-typ\", \"variablen_typ\", \"formatcode\"],\n    \"rule\": [\"rule\", \"regel\", \"logik_korrekt\"],\n    \"message\": [\"message\", \"fehlermeldung\"],\n}\n\nCORRECTION_COLUMNS = [\n    \"correction_id\", \"query_id\", \"id\", \"variable\", \"old_value\", \"new_value\",\n    \"reason\", \"source\", \"date\", \"changed_by\",\n]\n_NUMBER = re.compile(r\"^-?\\d+(\\.\\d+)?$\")\nFINDING_COLUMNS = [\"query_id\", \"site\", \"id\", \"variable\", \"question\", \"value\", \"type\", \"message\", \"rule\"]\n\n\n@dataclass\nclass FieldSpec:\n    variable: str\n    fmt: FieldFormat\n    rule: str = \"\"\n    message: str = \"\"\n    label: str = \"\"\n    coding: str = \"\"\n\n\n@dataclass\nclass RuleIssue:\n    variable: str\n    rule: str\n    problem: str\n\n\n@dataclass\nclass Result:\n    cleaned: pd.DataFrame\n    findings: pd.DataFrame\n    audit: pd.DataFrame\n    rule_issues: list[RuleIssue] = field(default_factory=list)\n\n    @property\n    def errors(self) -> pd.DataFrame:  # backwards compatible name\n        return self.findings\n\n    @property\n    def summary(self) -> pd.DataFrame:\n        n = len(self.cleaned)\n        n_bad = int((self.cleaned[\"_n_findings\"] > 0).sum()) if n else 0\n        st = self.audit[\"status\"] if len(self.audit) else pd.Series(dtype=str)\n        rows = [\n            (\"records\", n),\n            (\"records without findings\", n - n_bad),\n            (\"records with findings (open queries)\", n_bad),\n            (\"share with findings (%)\", round(100 * n_bad / n, 1) if n else 0.0),\n            (\"findings total\", len(self.findings)),\n            (\"  format findings\", int((self.findings[\"type\"] == \"format\").sum())),\n            (\"  rule findings\", int((self.findings[\"type\"] == \"rule\").sum())),\n            (\"corrections applied\", int((st == \"applied\").sum())),\n            (\"corrections NOT applied (conflict)\", int((st != \"applied\").sum())),\n            (\"rules that could not be used\", len(self.rule_issues)),\n        ]\n        return pd.DataFrame(rows, columns=[\"measure\", \"value\"], dtype=object)\n\n\n# --------------------------------------------------------------------------\n# 1. Rules sheet (data validation plan)\n# --------------------------------------------------------------------------\ndef load_specs(path: str | Path | io.BytesIO, sheet: str | int = 0) -> list[FieldSpec]:\n    \"\"\"Read the rules sheet. One row per CRF field.\"\"\"\n    df = pd.read_excel(path, sheet_name=sheet, dtype=str, keep_default_na=False).fillna(\"\")\n    lookup = {c.strip().lower(): c for c in df.columns}\n    cols = {key: next((lookup[n] for n in names if n in lookup), None) for key, names in _ALIASES.items()}\n    if cols[\"variable\"] is None or cols[\"format\"] is None:\n        raise ValueError(f\"rules sheet needs a variable and a format column (found: {list(df.columns)})\")\n\n    specs = []\n    for _, row in df.iterrows():\n        var = row[cols[\"variable\"]].strip()\n        if not var or var.startswith(\"#\"):  # scanner metadata rows such as #Date\n            continue\n\n        def get(key: str) -> str:\n            return row[cols[key]].strip() if cols[key] else \"\"\n\n        specs.append(FieldSpec(var, parse_format(get(\"format\")), get(\"rule\"), get(\"message\"),\n                               get(\"label\"), get(\"coding\")))\n    return specs\n\n\ndef compile_rules(specs: list[FieldSpec]) -> tuple[list[tuple[FieldSpec, CompiledRule]], list[RuleIssue]]:\n    \"\"\"Translate every rule. Broken rules are reported, not raised.\"\"\"\n    columns = [s.variable for s in specs]\n    compiled, issues = [], []\n    for s in specs:\n        if not s.rule:\n            continue\n        try:\n            compiled.append((s, translate(s.rule, s.variable, columns)))\n        except RuleError as exc:\n            issues.append(RuleIssue(s.variable, s.rule, str(exc)))\n    issues += [RuleIssue(s.variable, s.fmt.code, \"unknown format code, read as text\")\n               for s in specs if not s.fmt.known]\n    return compiled, issues\n\n\n# --------------------------------------------------------------------------\n# 2. Raw export  /  3. correction log\n# --------------------------------------------------------------------------\ndef read_raw(path: str | Path | io.BytesIO, sep: str = \"|\") -> pd.DataFrame:\n    \"\"\"Read a scanner export: one line per questionnaire, every value as text.\"\"\"\n    return pd.read_csv(path, sep=sep, dtype=str, keep_default_na=False)\n\n\ndef load_corrections(path: str | Path | io.BytesIO | None) -> pd.DataFrame:\n    \"\"\"Read the correction log (Excel). Every cell is treated as text.\"\"\"\n    if path is None:\n        return pd.DataFrame(columns=CORRECTION_COLUMNS)\n    df = pd.read_excel(path, dtype=str, keep_default_na=False).fillna(\"\")\n    df.columns = [c.strip().lower() for c in df.columns]\n    missing = [c for c in (\"id\", \"variable\", \"old_value\", \"new_value\") if c not in df.columns]\n    if missing:\n        raise ValueError(f\"correction log lacks columns {missing}\")\n    for c in CORRECTION_COLUMNS:\n        if c not in df.columns:\n            df[c] = \"\"\n    return df[CORRECTION_COLUMNS].apply(lambda s: s.str.strip())\n\n\ndef apply_corrections(raw: pd.DataFrame, log: pd.DataFrame, id_var: str) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"Apply the correction log to a copy of the raw data.\n\n    A correction is applied only if the value currently in the data equals\n    ``old_value``. Otherwise it is reported as a conflict - this protects\n    against corrections that were meant for an older version of the data.\n    The raw export itself is never changed: cleaned = raw + log.\n    \"\"\"\n    data = raw.copy()\n    by_lower = {c.lower(): c for c in data.columns}\n    rows = []\n    # corrections of the ID itself last, so the other rows still find their record\n    order = log.assign(_is_id=log[\"variable\"].str.lower() == id_var.lower()).sort_values(\"_is_id\", kind=\"stable\")\n    for _, c in order.iterrows():\n        rec = c.to_dict()\n        rec.pop(\"_is_id\", None)\n        col = by_lower.get(c[\"variable\"].lower())\n        hit = data.index[data[id_var].str.strip() == c[\"id\"]]\n        if col is None:\n            rec.update(found_value=\"\", status=\"unknown variable\")\n        elif len(hit) == 0:\n            rec.update(found_value=\"\", status=\"unknown id\")\n        else:\n            found = data.at[hit[0], col].strip()\n            rec[\"found_value\"] = found\n            if found == c[\"old_value\"]:\n                data.loc[hit, col] = c[\"new_value\"]\n                rec[\"status\"] = \"applied\"\n            else:\n                rec[\"status\"] = \"conflict\"\n        rows.append(rec)\n    audit = pd.DataFrame(rows, columns=CORRECTION_COLUMNS + [\"found_value\", \"status\"])\n    return data, audit\n\n\n# --------------------------------------------------------------------------\n# 4. Checks\n# --------------------------------------------------------------------------\ndef _convert(value: str, fmt: FieldFormat) -> tuple[Any, str | None]:\n    \"\"\"Return (typed value, format problem or None).\"\"\"\n    v = value.strip()\n    if v == \"\":\n        return (MISSING if fmt.kind in (\"num\", \"date\") else \"\"), None\n    if fmt.kind == \"char\":\n        return v, (f\"text longer than {fmt.max_len} characters\" if len(v) > fmt.max_len else None)\n    if fmt.kind == \"date\":\n        try:\n            return to_sas_date(_dt.datetime.strptime(v, \"%Y%m%d\").date()), None\n        except ValueError:\n            return MISSING, \"not a valid date (YYYYMMDD)\"\n    if not _NUMBER.match(v):\n        return MISSING, \"not a number\"\n    return float(v), None\n\n\ndef _display(value: Any, fmt: FieldFormat) -> str:\n    if value is None or value == MISSING:\n        return \"\"\n    if fmt.kind == \"date\":\n        return from_sas_date(value).isoformat()\n    if isinstance(value, float) and value.is_integer():\n        return str(int(value))\n    return str(value)\n\n\ndef run(raw: pd.DataFrame, specs: list[FieldSpec], id_var: str | None = None,\n        site_var: str | None = None, corrections: pd.DataFrame | None = None) -> Result:\n    id_var = id_var or specs[0].variable\n    names = [s.variable for s in specs]\n    if site_var is None:\n        site_var = next((n for n in names if n.lower() == \"site\"), None)\n    missing_cols = [n for n in names if n not in raw.columns]\n    if missing_cols:\n        raise ValueError(f\"raw data lacks columns defined in the rules sheet: {missing_cols}\")\n\n    log = corrections if corrections is not None else load_corrections(None)\n    data, audit = apply_corrections(raw, log, id_var)\n    compiled, issues = compile_rules(specs)\n    label = {s.variable: s.label for s in specs}\n\n    findings, typed_rows = [], []\n    for _, rec in data.iterrows():\n        row, out = {}, []\n        rid = rec[id_var].strip().lstrip(\"0\") or rec[id_var].strip()\n        site = rec[site_var].strip() if site_var else \"\"\n\n        def add(var: str, value: str, kind: str, message: str, rule: str) -> None:\n            out.append({\"query_id\": f\"Q-{rid}-{var}\", \"site\": site, \"id\": rid, \"variable\": var,\n                        \"question\": label.get(var, \"\"), \"value\": value, \"type\": kind,\n                        \"message\": message, \"rule\": rule})\n\n        for s in specs:\n            row[s.variable], problem = _convert(rec[s.variable], s.fmt)\n            if problem:\n                add(s.variable, rec[s.variable], \"format\", problem, s.fmt.code)\n        for s, rule in compiled:\n            try:\n                ok, msg = rule.evaluate(row), s.message or \"rule violated\"\n            except Exception as exc:  # type clash etc. - report per record\n                ok, msg = False, f\"rule could not be evaluated ({type(exc).__name__})\"\n            if not ok:\n                add(s.variable, _display(row[s.variable], s.fmt), \"rule\", msg, rule.sas)\n        typed = {s.variable: _clean_value(row[s.variable], s.fmt) for s in specs}\n        typed[\"_n_findings\"] = len(out)\n        typed[\"_finding_vars\"] = \", \".join(dict.fromkeys(f[\"variable\"] for f in out))\n        typed_rows.append(typed)\n        findings += out\n\n    fdf = pd.DataFrame(findings, columns=FINDING_COLUMNS)\n    fdf = fdf.sort_values([\"site\", \"id\", \"type\", \"variable\"], kind=\"stable\").reset_index(drop=True)\n    return Result(cleaned=pd.DataFrame(typed_rows), findings=fdf, audit=audit, rule_issues=issues)\n\n\ndef _clean_value(value: Any, fmt: FieldFormat) -> Any:\n    if value == MISSING:\n        return pd.NA\n    if fmt.kind == \"date\":\n        return from_sas_date(value)\n    if fmt.kind == \"num\" and isinstance(value, float) and value.is_integer():\n        return int(value)\n    return value\n\n\n# --------------------------------------------------------------------------\n# 5. Outputs\n# --------------------------------------------------------------------------\nQUERY_HEADERS = {\n    \"query_id\": \"Query ID\",\n    \"site\": \"Site\",\n    \"id\": \"Participant ID\",\n    \"question\": \"Question\",\n    \"variable\": \"Field\",\n    \"value\": \"Current value (have)\",\n    \"message\": \"Problem (why)\",\n    \"correct_value\": \"Correct value (want) - filled in by site\",\n    \"site_comment\": \"Comment / source document - site\",\n    \"answered\": \"Answered by / date - site\",\n}\n\n\ndef queries_by_site(result: Result) -> dict[str, pd.DataFrame]:\n    \"\"\"One query table per site, in the layout sent to the clinics.\"\"\"\n    q = result.findings.assign(correct_value=\"\", site_comment=\"\", answered=\"\")\n    q = q[list(QUERY_HEADERS)].rename(columns=QUERY_HEADERS)\n    if not len(q):\n        return {}\n    return {site or \"no_site\": part.reset_index(drop=True) for site, part in q.groupby(\"Site\", sort=True)}\n\n\ndef _format_sheet(ws, wide: tuple[int, ...] = ()) -> None:\n    from openpyxl.styles import Alignment, Font, PatternFill\n\n    ws.freeze_panes = \"A2\"\n    ws.auto_filter.ref = ws.dimensions\n    for c in ws[1]:\n        c.font = Font(bold=True)\n        c.fill = PatternFill(\"solid\", fgColor=\"DCE6F1\")\n        c.alignment = Alignment(wrap_text=True, vertical=\"top\")\n    for col in ws.columns:\n        width = max(len(str(c.value or \"\")) for c in col[:300])\n        ws.column_dimensions[col[0].column_letter].width = min(max(width + 2, 12), 60)\n    for idx in wide:\n        for c in list(ws.columns)[idx][1:]:\n            c.fill = PatternFill(\"solid\", fgColor=\"FFF2CC\")  # fields the site fills in\n\n\ndef query_workbook(table: pd.DataFrame, site: str) -> bytes:\n    \"\"\"Excel file for one site: queries + short instructions.\"\"\"\n    buf = io.BytesIO()\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as xl:\n        table.to_excel(xl, sheet_name=\"queries\", index=False)\n        _format_sheet(xl.book[\"queries\"], wide=(7, 8, 9))\n        pd.DataFrame({\"How to answer\": [\n            f\"Queries for site {site}. Please answer every row in the yellow columns.\",\n            \"Correct value (want): the value from the source document, or 'confirmed' if the current value is right.\",\n            \"Comment: where the value was checked (e.g. original questionnaire, page 2).\",\n            \"Return the file to data management. Do not change the grey columns.\",\n        ]}).to_excel(xl, sheet_name=\"how_to_answer\", index=False)\n        xl.book[\"how_to_answer\"].column_dimensions[\"A\"].width = 110\n    return buf.getvalue()\n\n\ndef report_workbook(result: Result) -> bytes:\n    buf = io.BytesIO()\n    issues = pd.DataFrame([vars(i) for i in result.rule_issues], columns=[\"variable\", \"rule\", \"problem\"])\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as xl:\n        result.summary.to_excel(xl, sheet_name=\"summary\", index=False)\n        result.findings.to_excel(xl, sheet_name=\"findings\", index=False)\n        result.audit.to_excel(xl, sheet_name=\"audit_trail\", index=False)\n        issues.to_excel(xl, sheet_name=\"rule_problems\", index=False)\n        for ws in xl.book.worksheets:\n            _format_sheet(ws)\n    return buf.getvalue()\n\n\ndef write_outputs(result: Result, outdir: str | Path) -> dict[str, Path]:\n    out = Path(outdir)\n    (out / \"queries\").mkdir(parents=True, exist_ok=True)\n    paths = {\"cleaned\": out / \"cleaned.csv\", \"report\": out / \"plausibility_report.xlsx\",\n             \"audit\": out / \"audit_trail.csv\"}\n    result.cleaned.to_csv(paths[\"cleaned\"], index=False)\n    result.audit.to_csv(paths[\"audit\"], index=False)\n    paths[\"report\"].write_bytes(report_workbook(result))\n    stamp = _dt.date.today().isoformat()\n    for site, table in queries_by_site(result).items():\n        p = out / \"queries\" / f\"queries_{site}_{stamp}.xlsx\"\n        p.write_bytes(query_workbook(table, site))\n        paths[f\"queries_{site}\"] = p\n    return paths\n", "crf_rules/formats.py": "\"\"\"Parse scanner/CRF format codes into field types.\n\nScanner software for paper CRFs (e.g. TeleForm-style exports) describes every\nfield with a short format code. The codes used here:\n\n    +\"0\"N(4)      numeric, exactly 4 digits (zero padded)\n    +\"0\"N(0-2)    numeric, 0 to 2 digits\n    -\" \"X(0-50)   text, up to 50 characters\n    +\" \"X(12)     text, 12 characters\n    YYMMDD        date, written as YYYYMMDD in the raw export\n\nThe parser is deliberately forgiving: an unknown code becomes a text field so\nthat reading the raw data never fails because of a typo in the rules sheet.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass\n\n_CODE_RE = re.compile(\n    r\"\"\"^[+-]?            # optional sign flag (padding direction)\n        (?:\"(?P<pad>.?)\")?  # optional pad character in quotes\n        (?P<kind>[NX])      # N = numeric, X = text\n        \\((?P<lo>\\d+)(?:-(?P<hi>\\d+))?\\)$\"\"\",\n    re.VERBOSE,\n)\n\n\n@dataclass(frozen=True)\nclass FieldFormat:\n    kind: str  # \"num\", \"char\" or \"date\"\n    min_len: int\n    max_len: int\n    code: str\n    known: bool = True\n\n    @property\n    def sas_informat(self) -> str:\n        if self.kind == \"num\":\n            return \"best32.\"\n        if self.kind == \"date\":\n            return \"yymmdd8.\"\n        return f\"${self.max_len}.\"\n\n    @property\n    def sas_format(self) -> str:\n        if self.kind == \"num\":\n            return f\"best{max(self.max_len, 1)}.\"\n        if self.kind == \"date\":\n            return \"yymmdd10.\"\n        return f\"${self.max_len}.\"\n\n\ndef parse_format(code: str | None) -> FieldFormat:\n    \"\"\"Translate one format code into a :class:`FieldFormat`.\"\"\"\n    raw = (code or \"\").strip()\n    # a space used as pad character must survive whitespace removal\n    compact = re.sub(r\"\\s+\", \"\", raw.replace('\" \"', '\"_\"'))\n    if compact.upper() == \"YYMMDD\":\n        return FieldFormat(\"date\", 8, 8, raw)\n\n    m = _CODE_RE.match(compact)\n    if not m:\n        return FieldFormat(\"char\", 0, 200, raw, known=False)\n\n    lo = int(m.group(\"lo\"))\n    hi = int(m.group(\"hi\")) if m.group(\"hi\") is not None else lo  # N(4) = fixed width\n    kind = \"num\" if m.group(\"kind\") == \"N\" else \"char\"\n    return FieldFormat(kind, lo, max(hi, 1), raw)\n", "crf_rules/rules.py": "\"\"\"Translate plausibility rules written in SAS syntax into Python.\n\nRules live in an Excel sheet, one per CRF field, written as SAS expressions in\nwhich ``#`` stands for the field itself, e.g.::\n\n    # >= 1 and # <= 12\n    # NOT IN (8 88)\n    (# = 0 AND missing(fu_tx_text)) OR # = 1\n\nThe same rule text is used twice: pasted unchanged into generated SAS code,\nand translated here so the checks also run without SAS.\n\nOnly a safe subset is accepted. Every identifier must be a known CRF variable\nor a whitelisted function, so a rules sheet cannot execute arbitrary code.\n\nSAS semantics that matter for plausibility checks are reproduced:\n* a numeric missing value (``.``) is smaller than every number,\n* arithmetic with a missing value stays missing,\n* text missing is the empty string.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime as _dt\nimport math\nimport re\nfrom dataclasses import dataclass\nfrom typing import Any, Callable, Iterable\n\nMISSING = float(\"-inf\")  # SAS: missing sorts below every number\n\n_TOKEN_RE = re.compile(\n    r\"\"\"\n    (?P<ws>\\s+)\n  | (?P<str>\"(?:[^\"]|\"\")*\"|'(?:[^']|'')*')\n  | (?P<num>\\d+\\.\\d*|\\d*\\.\\d+|\\d+)\n  | (?P<dot>\\.)\n  | (?P<hash>\\#)\n  | (?P<ne>[~^\u00ac]\\s*=)\n  | (?P<op><=|>=|=|<|>|\\+|-|\\*|/|\\(|\\)|,)\n  | (?P<name>[A-Za-z_][A-Za-z0-9_]*)\n    \"\"\",\n    re.VERBOSE,\n)\n\n_KEYWORDS = {\n    \"and\": \"and\",\n    \"or\": \"or\",\n    \"not\": \"not\",\n    \"in\": \"in\",\n    \"eq\": \"==\",\n    \"ne\": \"!=\",\n    \"lt\": \"<\",\n    \"gt\": \">\",\n    \"le\": \"<=\",\n    \"ge\": \">=\",\n}\n\n\nclass RuleError(ValueError):\n    \"\"\"Raised when a rule cannot be translated (typo, unknown variable, ...).\"\"\"\n\n\n# --------------------------------------------------------------------------\n# SAS functions available inside rules\n# --------------------------------------------------------------------------\ndef _is_missing(x: Any) -> bool:\n    if x is None:\n        return True\n    if isinstance(x, float) and (math.isnan(x) or x == MISSING):\n        return True\n    if isinstance(x, str) and x.strip() == \"\":\n        return True\n    return False\n\n\ndef _f_missing(x: Any) -> bool:\n    return _is_missing(x)\n\n\ndef _f_coalesce(*args: Any) -> Any:\n    for a in args:\n        if not _is_missing(a):\n            return a\n    return MISSING\n\n\nSAS_EPOCH = _dt.date(1960, 1, 1)\n\n\ndef to_sas_date(d: _dt.date) -> int:\n    \"\"\"Dates are kept as SAS date values (days since 1960-01-01), as in SAS.\"\"\"\n    return (d - SAS_EPOCH).days\n\n\ndef from_sas_date(n: float) -> _dt.date:\n    return SAS_EPOCH + _dt.timedelta(days=int(n))\n\n\ndef _f_today() -> int:\n    return to_sas_date(_dt.date.today())\n\n\ndef _f_year(d: Any) -> Any:\n    return MISSING if _is_missing(d) else from_sas_date(d).year\n\n\ndef _f_month(d: Any) -> Any:\n    return MISSING if _is_missing(d) else from_sas_date(d).month\n\n\ndef _f_day(d: Any) -> Any:\n    return MISSING if _is_missing(d) else from_sas_date(d).day\n\n\ndef _f_mdy(m: Any, d: Any, y: Any) -> Any:\n    if any(_is_missing(v) for v in (m, d, y)):\n        return MISSING\n    try:\n        return to_sas_date(_dt.date(int(y), int(m), int(d)))\n    except ValueError:\n        return MISSING\n\n\ndef _f_prxmatch(pattern: str, text: Any) -> int:\n    if _is_missing(text):\n        return 0\n    m = re.fullmatch(r\"/(.*)/([a-z]*)\", pattern)\n    regex, flags = (m.group(1), m.group(2)) if m else (pattern, \"\")\n    hit = re.search(regex, str(text), re.IGNORECASE if \"i\" in flags else 0)\n    return hit.start() + 1 if hit else 0\n\n\ndef _f_length(x: Any) -> int:\n    return 1 if _is_missing(x) else len(str(x).rstrip())\n\n\ndef _f_upcase(x: Any) -> Any:\n    return x.upper() if isinstance(x, str) else x\n\n\ndef _f_lowcase(x: Any) -> Any:\n    return x.lower() if isinstance(x, str) else x\n\n\ndef _f_strip(x: Any) -> Any:\n    return x.strip() if isinstance(x, str) else x\n\n\nFUNCTIONS: dict[str, Callable[..., Any]] = {\n    \"missing\": _f_missing,\n    \"coalesce\": _f_coalesce,\n    \"coalescec\": _f_coalesce,\n    \"today\": _f_today,\n    \"year\": _f_year,\n    \"month\": _f_month,\n    \"day\": _f_day,\n    \"mdy\": _f_mdy,\n    \"prxmatch\": _f_prxmatch,\n    \"length\": _f_length,\n    \"upcase\": _f_upcase,\n    \"lowcase\": _f_lowcase,\n    \"strip\": _f_strip,\n}\n\n\n# --------------------------------------------------------------------------\n# Translation\n# --------------------------------------------------------------------------\n@dataclass\nclass CompiledRule:\n    variable: str\n    text: str  # original rule as written in Excel\n    sas: str  # rule with '#' replaced, ready for a SAS IF statement\n    python: str  # translated expression\n    code: Any  # compiled code object\n    referenced: tuple[str, ...]\n\n    def evaluate(self, row: dict[str, Any]) -> bool:\n        env = {\"_v\": row, \"_M\": MISSING, **{f\"_f_{k}\": v for k, v in FUNCTIONS.items()}}\n        return bool(eval(self.code, {\"__builtins__\": {}}, env))  # noqa: S307 - whitelisted tokens only\n\n\ndef _tokenize(rule: str) -> list[tuple[str, str]]:\n    pos, out = 0, []\n    while pos < len(rule):\n        m = _TOKEN_RE.match(rule, pos)\n        if not m:\n            raise RuleError(f\"unexpected character {rule[pos]!r} at position {pos + 1}\")\n        kind = m.lastgroup or \"\"\n        if kind != \"ws\":\n            out.append((kind, m.group()))\n        pos = m.end()\n    return out\n\n\ndef _sas_string_to_python(tok: str) -> str:\n    quote = tok[0]\n    inner = tok[1:-1].replace(quote * 2, quote)\n    return repr(inner)\n\n\ndef translate(rule: str, variable: str, columns: Iterable[str]) -> CompiledRule:\n    \"\"\"Translate one SAS rule into a compiled Python expression.\n\n    ``columns`` are the CRF variables that may be referenced.\n    Raises :class:`RuleError` with a readable message if the rule is invalid.\n    \"\"\"\n    col_lookup = {c.lower(): c for c in columns}\n    if variable.lower() not in col_lookup:\n        raise RuleError(f\"rule belongs to unknown variable '{variable}'\")\n    tokens = _tokenize(rule)\n    if not tokens:\n        raise RuleError(\"rule is empty\")\n\n    parts: list[str] = []\n    referenced: list[str] = []\n    i = 0\n    while i < len(tokens):\n        kind, text = tokens[i]\n        low = text.lower()\n        nxt = tokens[i + 1] if i + 1 < len(tokens) else (\"\", \"\")\n\n        if kind == \"hash\":\n            parts.append(f'_v[\"{col_lookup[variable.lower()]}\"]')\n            referenced.append(col_lookup[variable.lower()])\n        elif kind == \"dot\":\n            parts.append(\"_M\")\n        elif kind == \"num\":\n            parts.append(text)\n        elif kind == \"str\":\n            parts.append(_sas_string_to_python(text))\n        elif kind == \"ne\":\n            parts.append(\"!=\")\n        elif kind == \"op\":\n            parts.append(\"==\" if text == \"=\" else text)\n        elif kind == \"name\":\n            if low in _KEYWORDS:\n                if low == \"not\" and nxt[1].lower() == \"in\":\n                    parts.append(\"not in\")\n                    i += 1\n                    low = \"in\"\n                else:\n                    parts.append(_KEYWORDS[low])\n                if low == \"in\":\n                    i = _translate_in_list(tokens, i + 1, parts)\n                    continue\n            elif low in FUNCTIONS and nxt[1] == \"(\":\n                parts.append(f\"_f_{low}\")\n                # SAS allows COALESCE(OF a, b) - drop the OF keyword\n                if i + 2 < len(tokens) and tokens[i + 2][1].lower() == \"of\":\n                    parts.append(\"(\")\n                    i += 3\n                    continue\n            elif low in col_lookup:\n                parts.append(f'_v[\"{col_lookup[low]}\"]')\n                referenced.append(col_lookup[low])\n            else:\n                raise RuleError(f\"unknown variable or function '{text}'\")\n        else:  # pragma: no cover - tokenizer only yields known kinds\n            raise RuleError(f\"cannot translate '{text}'\")\n        i += 1\n\n    python = \" \".join(parts)\n    try:\n        code = compile(python, f\"<rule {variable}>\", \"eval\")\n    except SyntaxError as exc:\n        raise RuleError(f\"syntax error: {exc.msg}\") from None\n\n    sas = re.sub(r\"#\", variable, rule)\n    return CompiledRule(variable, rule, sas, python, code, tuple(dict.fromkeys(referenced)))\n\n\ndef _translate_in_list(tokens: list[tuple[str, str]], i: int, parts: list[str]) -> int:\n    \"\"\"Translate ``IN (8 88)`` / ``IN (1,2,3)`` / ``IN (0 .)`` into a Python tuple.\"\"\"\n    if i >= len(tokens) or tokens[i][1] != \"(\":\n        raise RuleError(\"IN must be followed by a list in parentheses\")\n    i += 1\n    items: list[str] = []\n    while i < len(tokens) and tokens[i][1] != \")\":\n        kind, text = tokens[i]\n        if kind == \"num\":\n            items.append(text)\n        elif kind == \"dot\":\n            items.append(\"_M\")\n        elif kind == \"str\":\n            items.append(_sas_string_to_python(text))\n        elif text == \"-\" and i + 1 < len(tokens) and tokens[i + 1][0] == \"num\":\n            items.append(\"-\" + tokens[i + 1][1])\n            i += 1\n        elif text != \",\":\n            raise RuleError(f\"unexpected '{text}' inside IN list\")\n        i += 1\n    if i >= len(tokens):\n        raise RuleError(\"IN list is not closed with ')'\")\n    parts.append(\"(\" + \", \".join(items) + \",)\")\n    return i + 1\n", "crf_rules/sas_codegen.py": "\"\"\"Write the edit-check program in plain SAS.\n\nThe program is generated from the rules sheet and is meant to be READ by\npeople who are not SAS experts: one short block per rule, plain comments,\nthree paths to set at the top, no macros except one small loop at the end.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime as _dt\nimport textwrap\n\nfrom .engine import FieldSpec, compile_rules\n\n\ndef _sq(text: str) -> str:\n    \"\"\"SAS text in single quotes (nothing inside is resolved).\"\"\"\n    return \"'\" + text.replace(\"'\", \"''\") + \"'\"\n\n\ndef _wrap(words: list[str], indent: str = \"    \") -> str:\n    return textwrap.fill(\" \".join(words), width=88, initial_indent=indent, subsequent_indent=indent)\n\n\ndef generate_sas(specs: list[FieldSpec], id_var: str | None = None, site_var: str | None = \"site\",\n                 source: str = \"rules.xlsx\") -> str:\n    id_var = id_var or specs[0].variable\n    names = [s.variable for s in specs]\n    site = next((n for n in names if site_var and n.lower() == site_var.lower()), None)\n    compiled, issues = compile_rules(specs)\n    first, last = f\"t_{names[0]}\", f\"t_{names[-1]}\"\n    out: list[str] = []\n    a = out.append\n\n    a(\"/* ============================================================================\")\n    a(f\"   EDIT-CHECK PROGRAM  -  generated from {source} on {_dt.date.today().isoformat()}\")\n    a(\"   Do not edit by hand: change the rules sheet and generate the program again.\")\n    a(\"\")\n    a(\"   Step 1  read the raw scanner export (every field as text, file is never changed)\")\n    a(\"   Step 2  apply the correction log  -> audit trail (applied / conflict)\")\n    a(\"   Step 3  convert text to numbers and dates  -> format findings\")\n    a(f\"   Step 4  check the {len(compiled)} plausibility rules  -> rule findings\")\n    a(\"   Step 5  save: cleaned data, findings, audit trail, one query file per site\")\n    for i in issues:\n        a(f\"   NOTE: rule for {i.variable} skipped - {i.problem}\")\n    a(\"   ============================================================================ */\")\n    a(\"\")\n    a(\"/* ---- set these three paths, then run the whole program ---------------------- */\")\n    a(\"%let raw_file        = C:/study/data/raw_export.csv;\")\n    a(\"%let correction_log  = C:/study/corrections/corrections_log.xlsx;\")\n    a(\"%let output_folder   = C:/study/output;\")\n    a(\"\")\n\n    # ---------------------------------------------------------------- step 1\n    a(\"/* ---- Step 1: read the raw export. t_ = text exactly as scanned ------------- */\")\n    a(\"data raw;\")\n    a('  infile \"&raw_file.\" dlm=\"|\" dsd truncover firstobs=2 lrecl=32767;')\n    a(_wrap([\"length\"] + [f\"t_{n}\" for n in names] + [\"$200;\"], \"  \"))\n    a(_wrap([\"input\"] + [f\"t_{n}\" for n in names] + [\";\"], \"  \"))\n    a(\"run;\")\n    a(\"\")\n\n    # ---------------------------------------------------------------- step 2\n    a(\"/* ---- Step 2: apply the correction log ----------------------------------------\")\n    a(\"   Every change to the data is a row in the correction log (who, what, when, why).\")\n    a(\"   A change is applied only if the value in the data still equals old_value;\")\n    a(\"   otherwise it is marked as conflict and nothing is changed.                      */\")\n    a('proc import datafile=\"&correction_log.\" out=log_import dbms=xlsx replace;')\n    a(\"  getnames=yes;\")\n    a(\"run;\")\n    a(\"\")\n    a(\"data corrections;   /* make every column text, whatever Excel stored */\")\n    a(\"  set log_import(rename=(id=_id old_value=_old new_value=_new));\")\n    a(\"  length id old_value new_value $200;\")\n    a(\"  id = cats(_id);  old_value = cats(_old);  new_value = cats(_new);\")\n    a('  if old_value = \".\" then old_value = \"\";')\n    a('  if new_value = \".\" then new_value = \"\";')\n    a(\"  variable = lowcase(strip(variable));\")\n    a(\"  drop _id _old _new;\")\n    a(\"run;\")\n    a(\"\")\n    a(\"data raw_corrected(drop=id correction_id variable old_value new_value found_value status rc i)\")\n    a(\"     audit_trail(keep=correction_id id variable old_value new_value found_value status);\")\n    a(\"  set raw;\")\n    a(f\"  array field {{*}} $ {first}--{last};   /* all fields of the export */\")\n    a(\"  length correction_id $20 variable $32 old_value new_value found_value $200 status $10 id $200;\")\n    a(\"  if _n_ = 1 then do;   /* load the log into memory, looked up by participant ID */\")\n    a('    declare hash corr(dataset: \"corrections\", multidata: \"yes\");')\n    a('    corr.defineKey(\"id\");')\n    a('    corr.defineData(\"correction_id\", \"variable\", \"old_value\", \"new_value\");')\n    a(\"    corr.defineDone();\")\n    a(\"  end;\")\n    a(f\"  id = strip(t_{id_var});\")\n    a(\"  rc = corr.find();\")\n    a(\"  do while (rc = 0);   /* every correction for this participant */\")\n    a(\"    do i = 1 to dim(field);\")\n    a('      if lowcase(vname(field{i})) = cats(\"t_\", variable) then do;')\n    a(\"        found_value = field{i};\")\n    a('        if strip(found_value) = strip(old_value) then do; field{i} = new_value; status = \"applied\"; end;')\n    a('        else status = \"conflict\";')\n    a(\"        output audit_trail;\")\n    a(\"      end;\")\n    a(\"    end;\")\n le describes a GOOD value. */\")\n    for s, cr in compiled:\n        a(\"\")\n        a(f\"  /* {s.variable}: {s.label} */\" if s.label else f\"  /* {s.variable} */\")\n        a(f\"  if not ({cr.sas}) then do;\")\n        a(f'    variable=\"{s.variable}\"; value=vvalue({s.variable}); type=\"rule\";')\n        a(f\"    message={_sq(s.message or 'rule violated')};\")\n        a(f\"    rule={_sq(cr.sas)};\")\n        a(\"    link add_finding;\")\n        a(\"  end;\")\n    a(\"\")\n    a(\"  output checked;\")\n    a(\"  return;\")\n    a(\"\")\n    a(\"add_finding:   /* one finding = one query to the site */\")\n    a(f'  query_id = cats(\"Q-\", {id_var}, \"-\", variable);')\n    a(\"  n_findings = n_findings + 1;\")\n    a(\"  output findings;\")\n    a(\"  return;\")\n    a(\"run;\")\n    a(\"\")\n\n    # ---------------------------------------------------------------- step 5\n    a(\"/* ---- Step 5: save results ----------------------------------------------------- */\")\n    a(f\"proc sort data=findings; by {site + ' ' if site else ''}{id_var} variable; run;\")\n    a(\"\")\n    a('proc export data=checked     outfile=\"&output_folder./cleaned.csv\"     dbms=csv replace; run;')\n    a('proc export data=findings    outfile=\"&output_folder./findings.csv\"    dbms=csv replace; run;')\n    a('proc export data=audit_trail outfile=\"&output_folder./audit_trail.csv\" dbms=csv replace; run;')\n    a(\"\")\n    a(\"title 'Summary';\")\n    a(\"proc sql;\")\n    a(\"  select count(*)              as records,\")\n    a(\"         sum(n_findings = 0)   as records_without_findings,\")\n    a(\"         sum(n_findings > 0)   as records_with_findings\")\n    a(\"  from checked;\")\n    a(\"  select status, count(*) as corrections from audit_trail group by status;\")\n    a(\"quit;\")\n    a(\"title;\")\n    if site:\n        a(\"\")\n        a(\"/* One Excel file per site with its queries. Sites fill in the yellow columns. */\")\n        a(\"data queries;\")\n        a(\"  se
